pipeline:
  name: iac-mig-instance
  identifier: iacmiginstance
  projectIdentifier: SFTY_Training
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: iac
        identifier: iac
        description: ""
        type: IACM
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Docker
            spec: {}
          workspace: IACM2ganesh
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: plan
                  identifier: plan
                  timeout: 10m
                  spec:
                    command: plan
              - step:
                  type: IACMApproval
                  name: IACMApproval_2
                  identifier: IACMApproval_2
                  spec: {}
              - parallel:
                  - step:
                      type: IACMTerraformPlugin
                      name: destroy
                      identifier: destroy
                      timeout: 1h
                      spec:
                        command: destroy
                      when:
                        stageStatus: Success
                        condition: <+pipeline.variables.choose> == "destroy"
                  - step:
                      type: IACMTerraformPlugin
                      name: apply
                      identifier: apply
                      spec:
                        command: apply
                      timeout: 1h
        tags: {}
        delegateSelectors:
          - docker-delegate-ganesh25-instance
    - stage:
        name: build
        identifier: build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Docker
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Run_1
                  identifier: Run_1
                  spec:
                    shell: Sh
                    command: |-
                      apt install java-17
                      mvn clean package
  properties:
    ci:
      codebase:
        connectorRef: githubconnectganeshtest
        repoName: disk-partition-vms-ansible-harness
        build: <+input>
  variables:
    - name: choose
      type: String
      description: ""
      required: false
      value: <+input>.default(apply).selectOneFrom(apply,destroy)
