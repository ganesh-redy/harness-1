pipeline:
  name: iac-mig-instance
  identifier: iacmiginstance
  projectIdentifier: SFTY_Training
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: iac
        identifier: iac
        description: ""
        type: IACM
        spec:
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Docker
            spec: {}
          workspace: IACM2ganesh
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: plan
                  identifier: plan
                  timeout: 10m
                  spec:
                    command: plan
              - step:
                  type: IACMApproval
                  name: IACMApproval_2
                  identifier: IACMApproval_2
                  spec: {}
              - step:
                  type: IACMTerraformPlugin
                  name: destroy
                  identifier: destroy
                  timeout: 1h
                  spec:
                    command: destroy
              - step:
                  type: IACMTerraformPlugin
                  name: IACMTerraformPlugin_4
                  identifier: IACMTerraformPlugin_4
                  spec:
                    command: init
                  timeout: 10m
              - step:
                  type: IACMApproval
                  name: IACMApproval_1
                  identifier: IACMApproval_1
                  spec:
                    autoApprove: false
                  timeout: 1h
        tags: {}
        delegateSelectors:
          - docker-delegate-ganesh25-instance
